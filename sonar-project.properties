sonar.projectKey=codedogapp_bakhyard
sonar.organization=codedogapp
sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.tests=.
sonar.test.inclusions=**/*_test.go,apps/web/src/**/*.test.ts,apps/web/src/test-setup.ts,apps/web/e2e/**,apps/web/playwright.config.ts

sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.coverage.exclusions=services/*/main.go,apps/web/src/main.ts

# Rule S1135 reads "todo" in a comment as a TODO tag, and the todos code names its subject in most
# comments. Ideas go into docs/plan.md, not into TODO comments (AGENTS.md; decision 105).
sonar.issue.ignore.multicriteria=todos
sonar.issue.ignore.multicriteria.todos.ruleKey=*:S1135
sonar.issue.ignore.multicriteria.todos.resourceKey=**/todos/**/*
