monorepo_root = true

[monorepo]
config_roots = ["apps/web"]

[tools]
go = "latest"
golangci-lint = "latest"
node = "latest"
pnpm = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"github:vladopajic/go-test-coverage" = "latest"
jactionlint = "latest"
shellcheck = "latest"
process-compose = "latest"

[env]
# process-compose's API server listens on localhost:8080 by default, the gateway's address.
# Nothing uses the API yet, so it stays off.
PC_NO_SERVER = "1"

[tasks.build]
description = "Build the web app, then the services into bin/"
depends = ["//apps/web:build"]
run = "go build -o bin/ ./services/..."

[tasks."build:e2e"]
description = "Build the gateway without its locks, for the end-to-end tests, into bin/e2e/"
run = "go build -tags e2e -o bin/e2e/ ./services/gateway"

# A plain task, so mise passes SIGINT, SIGTERM and SIGHUP on to process-compose, which stops the
# services. Its TUI needs the terminal, which mise takes away when it prefixes the output, as it
# does once tasks run in parallel (docs/plan.md §6.8).
[tasks.up]
description = "Build, then run every service with process-compose until you quit its TUI"
depends = ["build"]
output = "interleave"
run = "process-compose up"

[tasks.fmt]
description = "Format the Go code (gofumpt, golines)"
run = "golangci-lint fmt"

[tasks."fmt:check"]
description = "Fail if any Go file is not formatted"
run = "golangci-lint fmt --diff"

[tasks.lint]
description = "Lint the Go code (golangci-lint)"
run = [
    "golangci-lint config verify",
    "golangci-lint run",
]

[tasks."lint:compose"]
description = "Check process-compose.yaml (process-compose up --dry-run)"
run = "process-compose up --dry-run"

[tasks."lint:actions"]
description = "Lint the workflows of GitHub and of the homelab's Gitea (jactionlint, shellcheck)"
# Without files, jactionlint checks .github/ only.
run = ["jactionlint --shellcheck=shellcheck", "jactionlint --shellcheck=shellcheck .gitea/workflows/*.yml"]

[tasks.test]
description = "Run the Go tests with the race detector and write coverage.out"
run = "go test -race -coverprofile=coverage.out ./..."

[tasks.cover]
description = "Fail if test coverage is below the thresholds (go-test-coverage)"
depends = ["test"]
run = "go-test-coverage --config=.testcoverage.yml"

[tasks.vuln]
description = "Scan the dependencies for known vulnerabilities (govulncheck)"
run = "govulncheck ./..."

[tasks.check]
description = "Run the local quality gate, then the end-to-end tests"
depends = [
    "fmt:check",
    "lint",
    "lint:actions",
    "lint:compose",
    "cover",
    "vuln",
    "//apps/web:check",
]
# The end-to-end tests come last because they build the web app, which the Go gates read
# while they run: the web service embeds it.
run = "mise run //apps/web:e2e"

[tasks.sonar-issues]
description = "List open SonarQube Cloud issues"
usage = '''
arg "[pr]" help="Pull request number; without it, the issues on main"
'''
shell = "bash -c"
run = '''
set -euo pipefail
api="https://sonarcloud.io/api"
key=$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)
target="project '${key}'"
scope=""
if [[ -n "${usage_pr+set}" ]]; then
  if [[ ! "${usage_pr}" =~ ^[1-9][0-9]*$ ]]; then
    echo "error: pull request must be a positive integer, got '${usage_pr}'" >&2
    exit 1
  fi
  target+=", pull request '${usage_pr}'"
  scope="&pullRequest=${usage_pr}"
fi

if ! curl -sSf "${api}/components/show?component=${key}${scope}" >/dev/null; then
  echo "error: cannot read SonarQube Cloud ${target}" >&2
  exit 1
fi

curl -sSf "${api}/issues/search?componentKeys=${key}&resolved=false&ps=200${scope}" |
  jq -r --arg key "${key}" '
    [.issues[] | {
      impacts: ([.impacts[] | "\(.softwareQuality):\(.severity)"] | sort | join(",")),
      rule,
      path: (.component | ltrimstr($key + ":")),
      line: (.line // 0),
      message
    }]
    | sort_by(.path, .line)[]
    | "\(.impacts)\t\(.rule)\t\(.path)\tL\(.line)\t\(.message)"'
'''
