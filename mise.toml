monorepo_root = true

[monorepo]
config_roots = ["apps/web"]

[tools]
go = "latest"
golangci-lint = "latest"
node = "latest"
pnpm = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"github:vladopajic/go-test-coverage" = "latest"
jactionlint = "latest"
shellcheck = "latest"
buf = "latest"
process-compose = "latest"
# The planner's Copilot CLI, pinned at the version that the Copilot SDK in go.mod names, which
# copilot:check checks (decision 74). Lazy, it installs when first run, so CI, which never runs
# it, doesn't download it.
copilot = { version = "1.0.105", lazy = true }

[env]
# process-compose's API server listens on localhost:8080 by default, the gateway's address.
# Nothing uses the API yet, so it stays off.
PC_NO_SERVER = "1"

[tasks.build]
description = "Build the web app, then the services into bin/ and the tools into bin/tools/"
depends = ["//apps/web:build"]
run = "go build -o bin/ ./services/... && go build -o bin/tools/ ./tools/..."

[tasks."build:e2e"]
description = "Build the gateway without its locks, for the end-to-end tests, into bin/e2e/"
run = "go build -tags e2e -o bin/e2e/ ./services/gateway"

# A plain task, so mise passes SIGINT, SIGTERM and SIGHUP on to process-compose, which stops the
# services. Its TUI needs the terminal, which mise takes away when it prefixes the output, as it
# does once tasks run in parallel (docs/plan.md §6.8).
[tasks.up]
description = "Build, then run every service with process-compose until you quit its TUI"
depends = ["build"]
output = "interleave"
run = "process-compose up"

[tasks.fmt]
description = "Format the Go code (gofumpt, golines) and the protobuf contracts (buf)"
run = ["golangci-lint fmt", "buf format --write"]

[tasks."fmt:check"]
description = "Fail if any Go file or protobuf contract is not formatted"
run = ["golangci-lint fmt --diff", "buf format --diff --exit-code"]

[tasks.lint]
description = "Lint the Go code (golangci-lint) and the protobuf contracts (buf)"
run = [
    "golangci-lint config verify",
    "golangci-lint run",
    "buf lint",
]

[tasks.gen]
description = "Generate the Go code of the protobuf contracts into internal/gen (buf)"
run = "buf generate"

[tasks."gen:check"]
description = "Fail if internal/gen differs from what the protobuf contracts generate"
shell = "bash -c"
run = '''
set -euo pipefail
fresh=$(mktemp -d)
trap 'rm -rf "${fresh}"' EXIT
buf generate --output "${fresh}"
if ! diff -r "${fresh}/internal/gen" internal/gen; then
  echo "error: internal/gen is out of date; run mise run gen" >&2
  exit 1
fi
'''

[tasks."copilot:check"]
description = "Fail if mise's or the planner image's copilot isn't the CLI that the Copilot SDK names"
shell = "bash -c"
run = '''
set -euo pipefail
sdk=$(go list -m -json github.com/github/copilot-sdk/go | jq -er .Version)
named=$(curl -sSf "https://raw.githubusercontent.com/github/copilot-sdk/go/${sdk}/nodejs/package.json" |
  jq -er .copilotCliVersion)
pinned=$(mise config get --file mise.toml tools.copilot.version)
if [[ "${pinned}" != "${named}" ]]; then
  echo "error: mise.toml pins copilot ${pinned}, but the Copilot SDK ${sdk} names ${named}" >&2
  exit 1
fi
dockerfile=services/planner/Dockerfile
image=$(sed -n 's/^ARG COPILOT_VERSION=//p' "${dockerfile}")
if [[ "${image}" != "${named}" ]]; then
  echo "error: ${dockerfile} has copilot ${image}, but the Copilot SDK ${sdk} names ${named}" >&2
  exit 1
fi
sum=$(sed -n 's/^ARG COPILOT_SHA256=//p' "${dockerfile}")
released=$(curl -sSfL "https://github.com/github/copilot-cli/releases/download/v${named}/SHA256SUMS.txt" |
  awk '$2 == "copilot-linux-x64.tar.gz" { print $1 }')
if [[ "${sum}" != "${released}" ]]; then
  echo "error: ${dockerfile} has the checksum ${sum}, but copilot ${named}'s release has ${released}" >&2
  exit 1
fi
'''

[tasks."lint:compose"]
description = "Check process-compose.yaml (process-compose up --dry-run)"
run = "process-compose up --dry-run"

[tasks."lint:actions"]
description = "Lint the workflows of GitHub and of the homelab's Gitea (jactionlint, shellcheck)"
# Without files, jactionlint checks .github/ only.
run = ["jactionlint --shellcheck=shellcheck", "jactionlint --shellcheck=shellcheck .gitea/workflows/*.yml"]

[tasks.test]
description = "Run the Go tests with the race detector and write coverage.out"
run = "go test -race -coverprofile=coverage.out ./..."

[tasks.cover]
description = "Fail if test coverage is below the thresholds (go-test-coverage)"
depends = ["test"]
run = "go-test-coverage --config=.testcoverage.yml"

[tasks.vuln]
description = "Scan the dependencies for known vulnerabilities (govulncheck)"
run = "govulncheck ./..."

[tasks.check]
description = "Run the local quality gate, then the end-to-end tests"
depends = [
    "fmt:check",
    "lint",
    "lint:actions",
    "lint:compose",
    "gen:check",
    "copilot:check",
    "cover",
    "vuln",
    "//apps/web:check",
]
# The end-to-end tests come last because they build the web app, which the Go gates read
# while they run: the web service embeds it.
run = "mise run //apps/web:e2e"

[tasks.sonar-issues]
description = "List open SonarQube Cloud issues"
usage = '''
arg "[pr]" help="Pull request number; without it, the issues on main"
'''
shell = "bash -c"
run = '''
set -euo pipefail
api="https://sonarcloud.io/api"
key=$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)
target="project '${key}'"
scope=""
if [[ -n "${usage_pr+set}" ]]; then
  if [[ ! "${usage_pr}" =~ ^[1-9][0-9]*$ ]]; then
    echo "error: pull request must be a positive integer, got '${usage_pr}'" >&2
    exit 1
  fi
  target+=", pull request '${usage_pr}'"
  scope="&pullRequest=${usage_pr}"
fi

if ! curl -sSf "${api}/components/show?component=${key}${scope}" >/dev/null; then
  echo "error: cannot read SonarQube Cloud ${target}" >&2
  exit 1
fi

curl -sSf "${api}/issues/search?componentKeys=${key}&resolved=false&ps=200${scope}" |
  jq -r --arg key "${key}" '
    [.issues[] | {
      impacts: ([.impacts[] | "\(.softwareQuality):\(.severity)"] | sort | join(",")),
      rule,
      path: (.component | ltrimstr($key + ":")),
      line: (.line // 0),
      message
    }]
    | sort_by(.path, .line)[]
    | "\(.impacts)\t\(.rule)\t\(.path)\tL\(.line)\t\(.message)"'
'''
