# Copy this file to mise.local.toml, which git ignores, and fill it in. mise puts its [env] into
# every task's environment. docs/setup.md says more about each setting; the secrets themselves go
# into the Keychain, not here.
[env]
# The name the Home's greeting uses. Without it, the greeting says "there".
BAKHYARD_NAME = "Alex"
# The one Tailscale login the gateway lets in.
BAKHYARD_TAILSCALE_LOGIN = "you@example.com"
# The name that tailscale serve publishes.
BAKHYARD_HOST = "machine.tailnet.ts.net"
# The Google OAuth client's ID.
BAKHYARD_GOOGLE_CLIENT_ID = "1234567890-abcdef.apps.googleusercontent.com"
# The one email the gateway lets sign in. Its first sign-in pins its Google account.
BAKHYARD_GOOGLE_EMAIL = "you@example.com"
# The Obsidian vault's folder, as an absolute path. The notes service lists its files.
BAKHYARD_VAULT = "/Users/you/Documents/Vault"
# The Jira site whose open tickets the todos service lists, Jira's REST API for a token with
# scopes, and the email of the token's account; the token goes into the Keychain. Leave all
# three out to run without Jira.
# BAKHYARD_JIRA_SITE = "https://your-site.atlassian.net"
# BAKHYARD_JIRA_API = "https://api.atlassian.com/ex/jira/<cloud ID>"
# BAKHYARD_JIRA_EMAIL = "you@example.com"
# Bitbucket's REST API, the email of the Atlassian account whose open pull requests the pulls
# service lists, and the slugs of the workspaces to list them in, separated by commas; the token
# goes into the Keychain. Leave all three out to run without Bitbucket.
# BAKHYARD_BITBUCKET_API = "https://api.bitbucket.org/2.0"
# BAKHYARD_BITBUCKET_EMAIL = "you@example.com"
# BAKHYARD_BITBUCKET_WORKSPACES = "acme,globex"
# The Go tests' own database. Put its role's password in place of <password>.
BAKHYARD_TEST_DATABASE = "postgres://bakhyard_test:<password>@127.0.0.1:5433/bakhyard_test"
