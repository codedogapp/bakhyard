# Copy this file to mise.local.toml, which git ignores, and fill it in. mise puts its [env] into
# every task's environment. docs/setup.md says more about each setting; the secrets themselves go
# into the Keychain, not here.
[env]
# The name the Home's greeting uses. Without it, the greeting says "there".
BAKHYARD_NAME = "Alex"
# The one Tailscale login the gateway lets in.
BAKHYARD_TAILSCALE_LOGIN = "you@example.com"
# The name that tailscale serve publishes.
BAKHYARD_HOST = "machine.tailnet.ts.net"
# The Google OAuth client's ID.
BAKHYARD_GOOGLE_CLIENT_ID = "1234567890-abcdef.apps.googleusercontent.com"
# The one email the gateway lets sign in. Its first sign-in pins its Google account.
BAKHYARD_GOOGLE_EMAIL = "you@example.com"
# The Obsidian vault's folder, as an absolute path. The notes service lists its files.
BAKHYARD_VAULT = "/Users/you/Documents/Vault"
# The vault's repository in Gitea's API, where the notes service saves notes as Gitea's bot user;
# the bot's token goes into the Keychain. Leave it out, as the Mac normally does, to keep notes
# read-only.
# BAKHYARD_VAULT_REPO = "https://gitea.tailnet.ts.net/api/v1/repos/you/vault"
# The web address of the vault's history in Gitea, with the branch that the Mac pushes to; a note's
# page then links to the note's history there. Leave it out for no such link.
# BAKHYARD_VAULT_HISTORY = "https://gitea.tailnet.ts.net/you/vault/commits/branch/main"
# The Jira site whose open tickets the todos service lists and whose worklogs the time service
# reads, Jira's REST API for a token with scopes, and the email of the token's account; the token
# goes into the Keychain. Leave all three out to run without Jira.
# BAKHYARD_JIRA_SITE = "https://your-site.atlassian.net"
# BAKHYARD_JIRA_API = "https://api.atlassian.com/ex/jira/<cloud ID>"
# BAKHYARD_JIRA_EMAIL = "you@example.com"
# The day the Jira token expires, as the API tokens' page shows it. From 14 days before, the Home
# reminds you to renew it. Leave it out for no reminder.
# BAKHYARD_JIRA_TOKEN_EXPIRES = "2027-10-31"
# Bitbucket's REST API, the email of the Atlassian account whose open pull requests the pulls
# service lists, and the slugs of the workspaces to list them in, separated by commas; the token
# goes into the Keychain. Leave all three out to run without Bitbucket.
# BAKHYARD_BITBUCKET_API = "https://api.bitbucket.org/2.0"
# BAKHYARD_BITBUCKET_EMAIL = "you@example.com"
# BAKHYARD_BITBUCKET_WORKSPACES = "acme,globex"
# The day the Bitbucket token expires. From 14 days before, the Home reminds you to renew it.
# Leave it out for no reminder.
# BAKHYARD_BITBUCKET_TOKEN_EXPIRES = "2027-10-31"
# GitHub's REST API, where the github service searches for your open pull requests, those that
# wait for your review and the open issues assigned to you; the token goes into the Keychain.
# Leave it out to run without GitHub.
# BAKHYARD_GITHUB_API = "https://api.github.com"
# The id of the Exophase profile whose games the games service lists, digits only: the
# playerProfileId in the profile page's source. Leave it out to run without Exophase.
# BAKHYARD_EXOPHASE_PLAYER = "1234567"
# The client ID of the Twitch app with which the games service asks IGDB for the games' covers;
# its client secret goes into the Keychain. Leave it out to run without covers.
# BAKHYARD_TWITCH_CLIENT_ID = "0123456789abcdefghijklmnopqrst"
# The GitHub host of the work account whose Copilot the planner service works out plans with,
# without https://, and the Copilot CLI's own folder, as an absolute path; the token goes into the
# Keychain. Leave the host out to run without Copilot.
# BAKHYARD_COPILOT_HOST = "example.ghe.com"
# BAKHYARD_COPILOT_HOME = "/Users/you/Library/Application Support/Bakhyard/Copilot"
# The Go tests' own database. Put its role's password in place of <password>.
BAKHYARD_TEST_DATABASE = "postgres://bakhyard_test:<password>@127.0.0.1:5433/bakhyard_test"
