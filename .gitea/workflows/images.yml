# Builds each service's image with the cluster's BuildKit and pushes it to Gitea's registry, on every
# mirror sync that brings a push to main, and on demand, in the homelab's Gitea, which mirrors this
# repository (docs/plan.md, decisions 138, 152, 153 and 156). GitHub ignores .gitea/.
name: images
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDKIT_HOST: tcp://buildkitd.buildkit.svc:1234
      # The registry's host, an organisation variable in Gitea, keeps the tailnet's name out of
      # this public repo. GITHUB_SERVER_URL is the runner's in-cluster address, not the host.
      REGISTRY: ${{ vars.REGISTRY }}
      # renovate: datasource=github-releases depName=moby/buildkit
      BUILDKIT_VERSION: v0.34.1
    steps:
      - name: Check the registry
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "The organisation variable REGISTRY, the registry's host, isn't set in Gitea." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install buildctl
        run: |
          curl -fsSL "https://github.com/moby/buildkit/releases/download/$BUILDKIT_VERSION/buildkit-$BUILDKIT_VERSION.linux-amd64.tar.gz" \
            | tar -xz -C /usr/local bin/buildctl
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          # Gitea takes a token given as the password whatever the user name, so the name is a placeholder.
          mkdir -p ~/.docker
          auth=$(printf 'token:%s' "$TOKEN" | base64 -w0)
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$auth" > ~/.docker/config.json
      - name: Build and push
        run: |
          # One tag, main: Flux follows its digest (decision 156).
          for service in games gateway github home notes notify nudge pulls time todos web; do
            buildctl build --frontend dockerfile.v0 \
              --local context=. --local "dockerfile=services/$service" \
              --opt platform=linux/amd64 \
              --output "type=image,name=$REGISTRY/codedogapp/bakhyard/$service:main,push=true"
          done
