[tasks.install]
description = "Install the web dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Serve the web app with Vite, proxying /api to the gateway"
depends = [":install"]
run = "pnpm run dev"

[tasks.build]
description = "Build the web app into the web service (services/web/dist/app)"
depends = [":install"]
run = "pnpm run build"

[tasks.icons]
description = "Render the app icon's PNGs from public/icon.svg (resvg)"
tools.resvg = "latest"
run = [
  "resvg -w 180 -h 180 public/icon.svg public/apple-touch-icon.png",
  "resvg -w 192 -h 192 public/icon.svg public/icon-192.png",
  "resvg -w 512 -h 512 public/icon.svg public/icon-512.png",
]

[tasks.fmt]
description = "Format the web code and sort its imports (Biome)"
depends = [":install"]
run = "pnpm run format"

[tasks.lint]
description = "Fail on unformatted code, unsorted imports or lint findings (Biome)"
depends = [":install"]
run = "pnpm run lint"

[tasks.typecheck]
description = "Type-check the web code (svelte-check with TypeScript 7)"
depends = [":install"]
run = "pnpm run typecheck"

[tasks.test]
description = "Run the web tests and fail below the coverage thresholds (Vitest)"
depends = [":install"]
run = "pnpm run test"

[tasks.unused]
description = "Fail on unused files, exports or dependencies (knip)"
depends = [":install"]
run = "pnpm run unused"

[tasks.browsers]
description = "Install the browsers the end-to-end tests run in, and on Linux their system libraries (Playwright)"
depends = [":install"]
# A headless run needs only Chromium's headless shell. --with-deps installs the libraries with apt
# and sudo on Linux, and does nothing on macOS.
run = "pnpm exec playwright install --with-deps --only-shell chromium webkit"

[tasks.e2e]
description = "Run the end-to-end tests on the built app, in a desktop Chromium and a phone WebKit (Playwright)"
depends = ["//:build", "//:build:e2e", ":browsers"]
run = "pnpm run e2e"

[tasks.audit]
description = "Fail on dependencies with known vulnerabilities (pnpm audit)"
run = "pnpm audit"

[tasks.check]
description = "Run the web quality gate"
depends = [":lint", ":typecheck", ":test", ":unused", ":audit"]
