# The services that mise run up runs with process-compose (docs/plan.md §4.9). Each one
# listens on its BAKHYARD_LISTEN. The gateway finds the others in its BAKHYARD_PEERS, home finds
# there the ones it asks what needs the user, and nudge and pulls find notify (§4.7).
# The gateway and todos find their databases at BAKHYARD_DATABASE, a URL without the password
# (docs/setup.md). Every address is on the loopback: tailscale serve publishes the gateway.
is_strict: true
ordered_shutdown: true

# Every service restarts after 1 s whenever it exits or fails its readiness probe 3 times in a
# row, unless you stopped it. A service still running 10 s after SIGTERM gets SIGKILL.
x-service: &service
  availability:
    restart: always
  shutdown:
    timeout_seconds: 10

processes:
  home:
    <<: *service
    description: Builds the Home screen from every app
    command: bin/home
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8081
      - BAKHYARD_PEERS=pulls=tcp://127.0.0.1:8085,todos=tcp://127.0.0.1:8084
    readiness_probe:
      http_get:
        port: 8081
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2

  web:
    <<: *service
    description: Serves the built web app
    command: bin/web
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8082
    readiness_probe:
      http_get:
        port: 8082
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2

  notes:
    <<: *service
    description: Lists the files of the Obsidian vault at BAKHYARD_VAULT
    command: bin/notes
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8083
    readiness_probe:
      http_get:
        port: 8083
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2

  todos:
    <<: *service
    description: Keeps the todos in its database and lists the open Jira tickets
    command: bin/todos
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8084
      - BAKHYARD_DATABASE=postgres://bakhyard_todos@127.0.0.1:5433/bakhyard_todos
    readiness_probe:
      http_get:
        port: 8084
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2

  pulls:
    <<: *service
    description: Lists my open pull requests on Bitbucket
    command: bin/pulls
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8085
      - BAKHYARD_PEERS=notify=tcp://127.0.0.1:8086
    readiness_probe:
      http_get:
        port: 8085
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2

  notify:
    <<: *service
    description: Keeps the phones' push subscriptions in its database and sends the pushes
    command: bin/notify
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8086
      - BAKHYARD_DATABASE=postgres://bakhyard_notify@127.0.0.1:5433/bakhyard_notify
    readiness_probe:
      http_get:
        port: 8086
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2

  nudge:
    <<: *service
    description: Keeps the agents' questions in its database and sends them to the phone
    command: bin/nudge
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8087
      - BAKHYARD_PEERS=notify=tcp://127.0.0.1:8086
      - BAKHYARD_DATABASE=postgres://bakhyard_nudge@127.0.0.1:5433/bakhyard_nudge
    depends_on:
      notify:
        condition: process_healthy
    readiness_probe:
      http_get:
        port: 8087
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2

  time:
    <<: *service
    description: Works out the time report from my Jira worklogs
    command: bin/time
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8088
    readiness_probe:
      http_get:
        port: 8088
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2

  gateway:
    <<: *service
    description: "The only way in: /api to the services, everything else to web"
    command: bin/gateway
    environment:
      - BAKHYARD_LISTEN=tcp://127.0.0.1:8080
      - BAKHYARD_PEERS=home=tcp://127.0.0.1:8081,notes=tcp://127.0.0.1:8083,notify=tcp://127.0.0.1:8086,nudge=tcp://127.0.0.1:8087,pulls=tcp://127.0.0.1:8085,todos=tcp://127.0.0.1:8084,web=tcp://127.0.0.1:8082
      - BAKHYARD_DATABASE=postgres://bakhyard_gateway@127.0.0.1:5433/bakhyard_gateway
    depends_on:
      home:
        condition: process_healthy
      notes:
        condition: process_healthy
      notify:
        condition: process_healthy
      nudge:
        condition: process_healthy
      pulls:
        condition: process_healthy
      todos:
        condition: process_healthy
      web:
        condition: process_healthy
    readiness_probe:
      http_get:
        port: 8080
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 2
